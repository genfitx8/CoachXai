services:
  - type: web
    name: coachxai-server
    env: node
    rootDir: server
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coachxai-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      # Admin console credentials (POST /api/auth/login/admin). Set
      # ADMIN_PASSWORD_HASH (bcrypt) in preference to ADMIN_PASSWORD. When
      # neither is set the server falls back to the legacy built-in pair
      # that used to be hardcoded in the frontend bundle.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: PAYAPP_SECRET_KEY
        sync: false
      - key: PAYAPP_API_BASE
        sync: false
      - key: PAYAPP_CHECKOUT_URL
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      # 메일 발송(비밀번호 찾기 + 회원가입 이메일 인증). 이 값들이 없으면
      # 서버는 메일을 보내지 않고 코드를 콘솔에만 출력하며, 가입 인증번호
      # 요청은 503으로 거절된다 — 즉 이메일 인증이 켜진 상태에서는 SMTP가
      # 필수다.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # 회원가입 이메일 인증 사용 여부(기본 true). SMTP를 붙이기 전까지
      # 가입을 열어 두어야 한다면 false 로 둔다.
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

databases:
  - name: coachxai-db
    databaseName: coachxai
    user: coachxai
    plan: basic-256mb
