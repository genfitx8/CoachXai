name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which variant to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - coach
          - student
      publish_release:
        description: "Publish APKs to the rolling latest-android-apk release"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - "claude/latest-android-apk-**"
    paths:
      - "components/**"
      - "hooks/**"
      - "services/**"
      - "utils/**"
      - "constants/**"
      - "types/**"
      - "native/**"
      - "public/**"
      - "index.tsx"
      - "index.html"
      - "index.css"
      - "App.tsx"
      - "swing.tsx"
      - "swing.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "capacitor.coach.config.ts"
      - "capacitor.student.config.ts"
      - "scripts/cap-run.mjs"
      - ".github/workflows/build-apk.yml"

jobs:
  prepare-matrix:
    name: Determine variants to build
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set.outputs.variants }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.variant }}" != "both" ]; then
            echo 'variants=["${{ inputs.variant }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["coach","student"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.variant }} debug APK
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prepare-matrix.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor (${{ matrix.variant }})
        run: npm run cap:sync:${{ matrix.variant }}

      - name: Grant gradlew execute permission
        run: chmod +x native/${{ matrix.variant }}/android/gradlew

      - name: Build debug APK (${{ matrix.variant }})
        working-directory: native/${{ matrix.variant }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-apks
          cp native/${{ matrix.variant }}/android/app/build/outputs/apk/debug/app-debug.apk \
             release-apks/CoachX-AI-${{ matrix.variant }}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: coachxai-${{ matrix.variant }}-debug-apk
          path: release-apks/CoachX-AI-${{ matrix.variant }}-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish rolling latest APK release
    needs: build
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APK artifacts
        uses: actions/download-artifact@v6
        with:
          path: apks
          pattern: coachxai-*-debug-apk
          merge-multiple: true

      - name: List downloaded APKs
        run: ls -lah apks/

      - name: Publish or update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest-android-apk
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SHORT_SHA="${SHA:0:7}"
          TITLE="Latest Android APKs (${BRANCH} @ ${SHORT_SHA})"
          BODY=$(cat <<EOF
          최신 debug APK — 브랜치 \`${BRANCH}\`, 커밋 \`${SHA}\`.

          폰 브라우저에서 아래 두 파일을 직접 받아 설치하세요.
          (설정 → "출처를 알 수 없는 앱 설치 허용" 필요)

          - \`CoachX-AI-coach-debug.apk\` — 코치 앱 (\`com.coachxai.coach\`)
          - \`CoachX-AI-student-debug.apk\` — 회원 앱 (\`com.coachxai.student\`)
          EOF
          )

          # Delete previous release (if any) so we can recreate against the new commit.
          gh release view "$TAG" >/dev/null 2>&1 && \
            gh release delete "$TAG" --yes --cleanup-tag || true
          # In case the tag lingered without a release, remove it too.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "$SHA" \
            --prerelease \
            apks/CoachX-AI-*-debug.apk
